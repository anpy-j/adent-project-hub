<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>添加项目弹窗 · ProjectHub 设计稿</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#2563EB', ink: '#0F172A', muted: '#64748B', line: '#E2E8F0', canvas: '#F8FAFC', ok: '#10B981' }, boxShadow: { pop: '0 16px 48px rgba(15,23,42,0.16)' }, borderRadius: { card: '12px', btn: '8px' } } } }
  </script>
  <style>.mono{font-family:ui-monospace,Menlo,monospace}</style>
</head>
<body class="bg-canvas text-ink-2 text-sm">
  <div class="min-h-[800px] bg-slate-900/40 flex justify-center items-center p-10">
    <div class="bg-white rounded-card shadow-pop w-[640px] p-6 flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <b class="text-lg text-ink">添加项目</b>
        <span class="w-6 h-6 rounded flex items-center justify-center text-muted">✕</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="px-3 py-1.5 rounded-full bg-primary text-white font-semibold">1 基本信息</span>
        <span class="w-6 border-t border-line"></span>
        <span class="px-3 py-1.5 rounded-full bg-canvas border border-line text-muted">2 关联仓库</span>
        <span class="w-6 border-t border-line"></span>
        <span class="px-3 py-1.5 rounded-full bg-canvas border border-line text-muted">3 确认完成</span>
      </div>
      <div class="flex flex-col gap-1.5">
        <span class="font-semibold text-ink">本地路径 *</span>
        <div class="h-10 px-3 rounded-btn border-2 border-primary flex items-center gap-2 ring-4 ring-primary/10">
          <i class="fa-solid fa-folder-open text-primary"></i><span class="flex-1 text-muted">选择本地项目目录</span>
          <span class="px-2 py-1 rounded border border-line text-xs">浏览</span><span class="px-2 py-1 rounded border border-line text-xs">识别</span>
        </div>
        <span class="text-xs text-ok">已识别：Node · vite · git 仓库（main）· 自动带出 origin</span>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1.5"><span class="font-semibold text-ink">项目名称 *</span><div class="h-9 px-3 rounded-btn border border-line flex items-center">disk-agent</div></div>
        <div class="flex flex-col gap-1.5"><span class="font-semibold text-ink">项目描述</span><div class="h-9 px-3 rounded-btn border border-line flex items-center text-muted">一句话描述</div></div>
      </div>
      <div class="flex flex-col gap-1.5">
        <span class="font-semibold text-ink">远程仓库关联</span>
        <div class="rounded-btn border border-line px-3 py-2 flex items-center gap-2">
          <span class="px-1.5 rounded bg-ink text-white text-xs">origin</span><span class="px-1.5 rounded bg-emerald-50 text-ok text-xs">默认</span>
          <span class="flex-1 truncate mono text-xs text-muted">git@github.com:anpy-j/disk-agent.git</span>
          <span class="text-xs text-danger">移除</span>
        </div>
        <div class="flex gap-2"><input class="flex-1 h-9 px-3 rounded-btn border border-line mono text-xs" placeholder="git@github.com:you/repo.git（留空则仅登记本地）"><span class="h-9 px-3 rounded-btn bg-primary text-white text-xs flex items-center">添加关联</span></div>
      </div>
      <div class="flex justify-end gap-2 pt-3 border-t border-line">
        <span class="h-9 px-5 rounded-btn border border-line flex items-center text-ink-2">取消</span>
        <span class="h-9 px-6 rounded-btn bg-primary text-white flex items-center font-semibold">添加</span>
      </div>
    </div>
  </div>
  <script id="interaction-data">`[]`</script>
</body>
</html>
